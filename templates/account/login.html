{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Sistem ERP</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <!-- Custom CSS -->
  <link href="{% static 'css/page/auth.css' %}" rel="stylesheet"/>
</head>
<body>

  <div class="login-wrapper">

    <!-- Header -->
    <div class="login-header">
      <i class="bi bi-layers logo-icon"></i>
      <h1>Sistem ERP</h1>
      <p>Manajemen Inventaris</p>
    </div>

    <!-- Body -->
    <div class="login-body">

      <!-- Alert Error -->
      <div class="alert-error" id="alertError" role="alert">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span id="alertMsg"></span>
      </div>

      <form id="loginForm" method="POST" action="{% url 'account_app:login'%}">
        {% csrf_token %}
        <!-- Username -->
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <div class="input-group">
            <i class="bi bi-person input-icon"></i>
            <input
            
              type="text"
              name="username"
              id="username"
              class="form-control"
              placeholder="Masukkan username"
              autocomplete="username"
            />
          </div>
          <div class="field-error" id="usernameErr"></div>
        </div>

        <!-- Password -->
        <div class="mb-1">
          <label class="form-label" for="password">Password</label>
          <div class="input-group">
            <i class="bi bi-lock input-icon"></i>
            <input
              type="password"
              name="password"
              id="password"
              class="form-control"
              placeholder="Masukkan password"
              autocomplete="current-password"
              style="padding-right: 2.5rem;"
            />
            <button type="button" class="toggle-pw" id="togglePw" title="Tampilkan password">
              <i class="bi bi-eye" id="eyeIcon"></i>
            </button>
          </div>
          <div class="field-error" id="passwordErr"></div>
        </div>

        <!-- Remember me & Forgot password -->
        <div class="row-meta">
          <div class="form-check">
            <input type="checkbox" id="rememberMe" />
            <label for="rememberMe">Ingat saya</label>
          </div>
          <a href="#" class="forgot-link">Lupa password?</a>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-login" id="btnLogin">
          <i class="bi bi-box-arrow-in-right"></i> Masuk
        </button>

      </form>
    </div>

    <!-- Footer -->
    <div class="login-footer">
      &copy; 2025 SISTEM ERP &nbsp;|&nbsp; Versi 1.0.0
    </div>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="{% static 'js/page/auth.js' %}"></script>

</body>
</html>
